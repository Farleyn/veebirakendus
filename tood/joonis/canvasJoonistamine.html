<!DOCTYPE html>
<html lang="ee">
<head>
    <meta charset="UTF-8">
    <title>Canvas joonistamine</title>
    <link rel="stylesheet" href="canvasStyle.css">
    <script src="canvasScript.js"></script>
</head>
<body>
<h1>Joonistusrakendus Canvas +JS</h1>
<canvas id="canvas" width="400" height="400"></canvas>
<table>
    <tr>
        <td>
            <input type="button" value="puhasta" onclick="puhasta()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="joon" onclick="joon()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="kolmnurk" onclick="kolmnurk()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="ristkylik" onclick="ristkylik()">
            <label for="laius">Laius:</label>
            <input type="number" id="laius" min="1" max="350"
                   value="200" onchange="ristkylik()">

            <label for="korgus">Kõrgus:</label>
            <input type="number" id="korgus" min="1" max="250"
                   value="150" onchange="ristkylik()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="ring" onclick="ring()">
            <label for="raadius">Raadius:</label>
            <input type="number" id="raadius" min="1" max="50" step="2" onchange="ring()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="pilt" onclick="pilt()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="ratas" onclick="ratas()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="ratas2" onclick="ratas2()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="kere" onclick="kere()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="kirst" onclick="kirst()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="tuled" onclick="tuled()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="kuld" onclick="kuld()">
        </td>
    </tr>
</table>
</body>
</html>
