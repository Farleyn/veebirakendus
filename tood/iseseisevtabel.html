<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Iseseisev töö</title>
    <link rel="stylesheet" href="tabelstyle.css">
</head>
<body>
<h1>Iseseisev töö</h1>

<h2>tabel</h2>

<table id="tunnitoo">

    <tr>
        <td rowspan="2">E</td>
        <td rowspan="2">D</td>
        <td>+</td>
        <td colspan="2" rowspan="3">F</td>
    </tr>

    <tr>
        <td>+</td>
    </tr>

    <tr>
        <td colspan="2" rowspan="2">1</td>
        <td rowspan="2">2</td>
    </tr>

    <tr>
        <td>+</td>
        <td rowspan="3">5</td>
    </tr>

    <tr>
        <td rowspan="2">3</td>
        <td>A</td>
        <td colspan="2">B</td>
    </tr>

    <tr>
        <td>C</td>
        <td colspan="2">D</td>
    </tr>

    <tr>
        <td colspan="4">4</td>
        <td>6</td>
    </tr>

</table>

</body>
</html>
