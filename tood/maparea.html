<h1>Map area kasutamine</h1>

        <li>Nina</li>
        <li>Klaviatuur</li>

          coords="120,630,720,760"

    <area shape="poly"
          coords="570,160,835,345,650,315"
          href="prillid.html"

          target="_blank">

    <area shape="circle"
          coords="615,245,10"
          href="silm1.html"
          alt="silm1"
          target="_blank">

    <area shape="rect"
          coords="545,350,650,430"
          href="suu.html"
          alt="suu"
          target="_blank">

    <area shape="rect"
          coords="50,75,350,210"
          href="testnupp.html"

    <area shape="poly"
          coords="460,440,580,530,475,530"
