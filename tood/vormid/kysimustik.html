<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Muusika küsimustik</title>
    <link rel="stylesheet" href="vormStyle.css">
</head>
<body>
<h1>Muusika küsimustik</h1>
<div>HTML vormid ja nupud</div>
<form action="#">
    <!-- c + tab komentaar -->
    <table border="1">
        <tr>
            <td>
                <!-- Tekstkast -->
                <label for="nimi">Nimi:</label>
            </td>
            <td>
                <input type="text" id="nimi" placeholder="Nikita Grossholm">
            </td>
        </tr>
        <td>
            <!-- ripploend või rippmenüü (выпадающий список) -->
            <label for="stiil">Vali meeldivaim muusikastiil</label>
        </td>
        <td>
            <select name="stiil" id="stiil">
                <option value="vali">vali..</option>
                <option value="hiphop">hiphop</option>
                <option value="kantri">kantri</option>
                <option value="metal">metal</option>
                <option value="rock">rock</option>
                <option value="jazz">jazz</option>
            </select>
        </td>
        <tr>
            <td>
                <!-- radio nupud -üks valik mitmest -->
                <strong for="">
                    Kuidas sa muusikat peamiselt kuulad?
                </strong>
            </td>
            <td>
                <input type="radio" name="platvorm" id="spotify">
                <label for="spotify">Spotify</label>
                <br>
                <input type="radio" name="platvorm" id="soundcloud">
                <label for="spotify">Soundcloud</label>
                <br>
                <input type="radio" name="platvorm" id="raadio">
                <label for="spotify">Raadio</label>
                <br>
                <input type="radio" name="platvorm" id="vinüülplaat">
                <label for="spotify">Vinüülplaat</label>
                <br>
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <!-- checkbox -->
                <fieldset>
                    <legend>Tee oma valikud - lemmik ansambel</legend>
                    <input type="checkbox" name="lemmikud" id="systemofdown">
                    <label for="systemofdown">System Of Down</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="metallica">
                    <label for="metallica">Metallica</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="hm">
                    <label for="hm">Haunted Mound</label>
                    <br>
                </fieldset>
            </td>
        </tr>
        <tr>
            <td>
                <!-- range - vahemik -->
                <label for="tund">
                    Mitu tundi päevas sa kuulad muusikat?
                </label>
            </td>
        </tr>
        <tr>
            <td>
                0<input type="range" id="tund" min="0" max="24">24
            </td>
        </tr>
        <tr>
            <td>
                Sisesta sinu email:
            </td>
            <td>
                <input type="email" placeholder="example@gmail.com">
            </td>
        </tr>
        <tr>
            <td>
                Vali sinu lemmik värv:
            </td>
            <td>
                <input type="color">
            </td>
        </tr>
        <tr>
            <td>
                Vali sinu lemmik muusika failis:
            </td>
            <td>
                <input type="file">
            </td>
        </tr>
        <tr>
            <td>
                Otse muusikat:
            </td>
            <td>
                <input type="search" placeholder="minu lemmik muusika">
            </td>
        </tr>
        <tr>
            <td>
                Millal sa viimati muusikat kuulasid?
            </td>
            <td>
                <input type="date">
            </td>
        <tr>
        <td>Salvesta muudatused</td>
        <td>
            <input type="submit">
        </td>
        </tr>
    </table>

</form>
</body>
</html>
