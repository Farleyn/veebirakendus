<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Muusika küsimustik</title>
    <link rel="stylesheet" href="vormStyle.css">
</head>
<body>
<h1>Muusika küsimustik</h1>
<div>HTML vormid ja nupud</div>
<form action="#">
    <table>
        <tr>
            <td>
                <label for="nimi">Nimi:</label>
            </td>
            <td>
                <input type="text" id="nimi" name="nimi" placeholder="Nikita Grossholm">
            </td>
        </tr>
        <tr>
            <td>
                <label for="stiil">Vali meeldivaim muusikastiil</label>
            </td>
            <td>
                <select name="stiil" id="stiil">
                    <option value="vali">vali..</option>
                    <option value="hiphop">hiphop</option>
                    <option value="kantri">kantri</option>
                    <option value="metal">metal</option>
                    <option value="rock">rock</option>
                    <option value="jazz">jazz</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>
                <strong>Kuidas sa muusikat peamiselt kuulad?</strong>
            </td>
            <td>
                <input type="radio" name="platvorm" id="spotify" value="spotify">
                <label for="spotify">Spotify</label>
                <br>
                <input type="radio" name="platvorm" id="soundcloud" value="soundcloud">
                <label for="soundcloud">Soundcloud</label>
                <br>
                <input type="radio" name="platvorm" id="raadio" value="raadio">
                <label for="raadio">Raadio</label>
                <br>
                <input type="radio" name="platvorm" id="vinüülplaat" value="vinüülplaat">
                <label for="vinüülplaat">Vinüülplaat</label>
                <br>
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <fieldset>
                    <legend>Tee oma valikud - lemmik ansambel</legend>
                    <input type="checkbox" name="lemmikud" id="systemofdown" value="systemofdown">
                    <label for="systemofdown">System Of Down</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="metallica" value="metallica">
                    <label for="metallica">Metallica</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="hm" value="hm">
                    <label for="hm">Haunted Mound</label>
                    <br>
                </fieldset>
            </td>
        </tr>
        <tr>
            <td>
                <label for="tund">Mitu tundi päevas sa kuulad muusikat?</label>
            </td>
            <td>
                <input type="range" id="tund" name="tund" min="0" max="24" oninput="tundValue.value = this.value">
                <output id="tundValue" for="tund">0</output>
            </td>
        </tr>
        <tr>
            <td>
                <label for="email">Sisesta sinu email:</label>
            </td>
            <td>
                <input type="email" id="email" name="email" placeholder="example@gmail.com">
            </td>
        </tr>
        <tr>
            <td>
                <label for="värv">Vali sinu lemmik värv:</label>
            </td>
            <td>
                <input type="color" id="värv" name="värv">
            </td>
        </tr>
        <tr>
            <td>
                <label for="muusikafail">Vali sinu lemmik muusika failis:</label>
            </td>
            <td>
                <input type="file" id="muusikafail" name="muusikafail">
            </td>
        </tr>
        <tr>
            <td>
                <label for="otsing">Otsi muusikat:</label>
            </td>
            <td>
                <input type="search" id="otsing" name="otsing" placeholder="minu lemmik muusika">
            </td>
        </tr>
        <tr>
            <td>
                <label for="kuupaev">Millal sa viimati muusikat kuulasid?</label>
            </td>
            <td>
                <input type="date" id="kuupaev" name="kuupaev">
            </td>
        </tr>
        <tr>
            <td>Salvesta muudatused</td>
            <td>
                <input type="submit" value="Salvesta">
            </td>
        </tr>
    </table>
</form>
</body>
</html>
