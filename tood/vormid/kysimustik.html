<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Muusika küsimustik</title>
    <link rel="stylesheet" href="vormStyle.css">
    <script src="../js/kysimustikScript.js"></script>
</head>
<body>
<h1>Muusika küsimustik</h1>
<div>HTML vormid ja nupud</div>
<form action="#">
    <table>
        <tr>
            <td>
                <label for="nimi">Nimi:</label>
            </td>
            <td>
                <input type="text" id="nimi" name="nimi" placeholder="Nikita Grossholm" oninput="nimiLugemineKastist()">
            </td>
            <td>
                <div id="vastus1"></div>
            </td>
        </tr>
        <tr>
            <td>
                <label for="stiil">Vali meeldivaim muusikastiil</label>
            </td>
            <td>
                <select name="stiil" id="stiil" onchange="selectValik()">
                    <option value="vali">vali..</option>
                    <option value="hiphop">hiphop</option>
                    <option value="kantri">kantri</option>
                    <option value="metal">metal</option>
                    <option value="rock">rock</option>
                    <option value="jazz">jazz</option>
                </select>
            </td>
            <td>
                <div id="vastus5"></div>
            </td>
        </tr>
        <tr>
            <td>
                <strong>Kuidas sa muusikat peamiselt kuulad?</strong>
            </td>
            <td>
                <input type="radio" name="platvorm" id="spotify" value="spotify" onclick="radioValik()">
                <label for="spotify">Spotify</label>
                <img src="../images/spotify.png" alt="" width="20">
                <br>
                <input type="radio" name="platvorm" id="soundcloud" value="soundcloud" onclick="radioValik()">
                <label for="soundcloud">Soundcloud</label>
                <img src="../images/sc.png" alt="" width="20">
                <br>
                <input type="radio" name="platvorm" id="raadio" value="raadio" onclick="radioValik()">
                <label for="raadio">Raadio</label>
                <img src="../images/raadio.png" alt="" width="20">
                <br>
                <input type="radio" name="platvorm" id="vinüülplaat" value="vinüülplaat" onclick="radioValik()">
                <label for="vinüülplaat">Vinüülplaat</label>
                <img src="../images/vinil.png" alt="" width="20">
                <br>
                <td>
            <div id="vastus2"></div>
        </td>
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <fieldset>
                    <legend>Tee oma valikud - lemmik ansambel</legend>
                    <input type="checkbox" name="lemmikud" id="systemofdown" value="System Of Down" onchange="checkboxValik()">
                    <label for="systemofdown">System Of Down</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="metallica" value="Metallica" onchange="checkboxValik()">
                    <label for="metallica">Metallica</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="hm" value="Haunted Mound" onchange="checkboxValik()">
                    <label for="hm">Haunted Mound</label>
                    <br>
                    <td>
                        <div id="vastus3"></div>
                    </td>
                </fieldset>
            </td>
        </tr>
        <tr>
            <td>
                <label for="tund">
                    Mitu tundi päevas sa kuulad muusikat?
                </label>
            </td>
            <td>
                0<input type="range" id="tund" name="tund" min="0" max="24" onchange="rangeValik()">24
            </td>
            <td>
                <div id="vastus4"></div>
            </td>
        </tr>
        <tr>
            <td>
                <label for="email">Sisesta sinu email:</label>
            </td>
            <td>
                <input type="email" id="email" name="email" placeholder="example@gmail.com">
            </td>
        </tr>
        <tr>
            <td>
                <label for="värv">Vali sinu lemmik värv:</label>
            </td>
            <td>
                <input type="color" id="värv" name="värv">
            </td>
        </tr>
        <tr>
            <td>
                <label for="muusikafail">Vali sinu lemmik muusika failis:</label>
            </td>
            <td>
                <input type="file" id="muusikafail" name="muusikafail">
            </td>
        </tr>
        <tr>
            <td>
                <label for="otsing">Otsi muusikat:</label>
            </td>
            <td>
                <input type="search" id="otsing" name="otsing" placeholder="minu lemmik muusika">
            </td>
        </tr>
        <tr>
            <td>
                <label for="kuupaev">Millal sa viimati muusikat kuulasid?</label>
            </td>
            <td>
                <input type="date" id="kuupaev" name="kuupaev">
            </td>
        </tr>

        <tr>

        </tr>
        <td>
            <b>Kas sa kuulad raadiot?</b>
        </td>
        <tf>
        <td>
            <input type="radio" id="yes" name="raadioValik" value="jah" onclick="radioValik1()">
            <label for="yes">Jah</label>
            <input type="radio" id="no" name="raadioValik" value="ei" onclick="radioValik1()">
            <label for="no">Ei</label>
        </td>
            <td>
                <div id="yesorno"></div>
            </td>
        </tf>

        <tr>
            <td>
                <label for="raadiojaam">Milliseid raadiojaamu oskad nimetada?</label>
            </td>
            <td>
                <input type="text" name="raadiojaam" id="raadiojaam" placeholder="skyradio" oninput="raadiojaamvalik()">
            </td>
            <td>
                <div id="vastus9"></div>
            </td>
        </tr>

        <tr>
            <td>Salvesta muudatused</td>
            <td>
                <input type="submit" value="Salvesta">
            </td>
        </tr>

        <tr>
            <td>
                <input type="reset" value="Puhasta" onclick="puhasta()">
            </td>
            <td>
                <input type="button" value="Näita/Loe andmed" onclick="naitaKoike()">
            </td>
            <td>
                <div id="vastusKoik"></div>
            </td>
        </tr>

    </table>
</form>
</body>
</html>
